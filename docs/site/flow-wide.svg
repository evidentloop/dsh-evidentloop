<svg xmlns="http://www.w3.org/2000/svg" class="flow-wide" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-labelledby="elw-title elw-desc">
<title id="elw-title">AI 变更评审：从代码改动到人工验收</title>
<desc id="elw-desc">会话中改代码，打开分支交付，手动发起审查，人工复核；确认完成后导出，需修改时发回草稿，由用户发送后继续修改与再审。</desc>
<style>
.elw-canvas{fill:#f6f8fc}.elw-node{fill:#fff;stroke:#dce3ef;stroke-width:1.5}.elw-key{fill:#edf3ff;stroke:#b2c9fa}.elw-text{fill:#17243c;font:600 16px system-ui,"PingFang SC",sans-serif}.elw-sub{fill:#596a83;font:12px system-ui,"PingFang SC",sans-serif}.elw-eyebrow{fill:#4868b2;font:600 12px system-ui,sans-serif;letter-spacing:1.5px}.elw-title{fill:#17243c;font:600 24px system-ui,"PingFang SC",sans-serif}.elw-icon{fill:none;stroke:#4176e6;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.elw-main{fill:none;stroke:#4176e6;stroke-width:2}.elw-feedback{fill:none;stroke:#74849d;stroke-width:2;stroke-dasharray:6 5}.elw-badge{fill:#edf3ff}
@media(prefers-color-scheme:dark){.elw-canvas{fill:#111927}.elw-node{fill:#1a2536;stroke:#34435a}.elw-key{fill:#1b2e4e;stroke:#4d6a98}.elw-text,.elw-title{fill:#e4edff}.elw-sub{fill:#adbbd1}.elw-eyebrow{fill:#7aaaff}.elw-icon{stroke:#7aaaff}.elw-main{stroke:#7aaaff}.elw-feedback{stroke:#9baac1}.elw-badge{fill:#233956}}
</style><defs>
<marker id="elw-main-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#4176e6" stroke-width="1.5"/></marker>
<marker id="elw-feedback-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#74849d" stroke-width="1.5"/></marker>
</defs>
<rect class="elw-canvas" width="1160" height="560" rx="20"/>
<text class="elw-eyebrow" x="48" y="42">EVIDENTLOOP / WORKFLOW</text>
<text class="elw-title" x="48" y="78">看清变更，再决定合并</text>
<path data-graph-role="edge" data-source="edit" data-target="delivery" class="elw-main" d="M216 202H272" marker-end="url(#elw-main-arrow)"/>
<path data-graph-role="edge" data-source="delivery" data-target="review" class="elw-main" d="M440 202H496" marker-end="url(#elw-main-arrow)"/>
<path data-graph-role="edge" data-source="review" data-target="human" class="elw-main" d="M664 202H720" marker-end="url(#elw-main-arrow)"/>
<path data-graph-role="edge" data-source="human" data-target="export" class="elw-main" d="M888 202H944" marker-end="url(#elw-main-arrow)"/>
<path data-graph-role="edge" data-source="human" data-target="feedback" class="elw-feedback" d="M804 256V340" marker-end="url(#elw-feedback-arrow)"/>
<path data-graph-role="edge" data-source="feedback" data-target="edit" class="elw-feedback" d="M804 448V496H132V256" marker-end="url(#elw-feedback-arrow)"/>
<g data-graph-role="node" data-node-id="edit" data-bounds="48,148,168,108">
<rect class="elw-node" x="48" y="148" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="64" y="162" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(68 166)"><path d="m5 15 9-9 4 4-9 9-5 1zM13 7l4 4M4 22h16"/></g>
<text class="elw-eyebrow" x="200" y="182" text-anchor="end">01</text>
<text class="elw-text" x="64" y="214">会话中改代码</text>
<text class="elw-sub" x="64" y="234">照常让 AI 完成修改</text>
</g>
<g data-graph-role="node" data-node-id="delivery" data-bounds="272,148,168,108">
<rect class="elw-node" x="272" y="148" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="288" y="162" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(292 166)"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 4v6m8-6v6M8 15h8"/></g>
<text class="elw-eyebrow" x="424" y="182" text-anchor="end">02</text>
<text class="elw-text" x="288" y="214">打开分支交付</text>
<text class="elw-sub" x="288" y="234">左侧「变更评审」</text>
</g>
<g data-graph-role="node" data-node-id="review" data-bounds="496,148,168,108">
<rect class="elw-node elw-key" x="496" y="148" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="512" y="162" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(516 166)"><path d="m8 5-5 7 5 7m8-14 5 7-5 7m-3-16-2 18"/></g>
<text class="elw-eyebrow" x="648" y="182" text-anchor="end">03</text>
<text class="elw-text" x="512" y="214">手动发起审查</text>
<text class="elw-sub" x="512" y="234">看说明 · 核需求 · 对 Diff</text>
</g>
<g data-graph-role="node" data-node-id="human" data-bounds="720,148,168,108">
<rect class="elw-node elw-key" x="720" y="148" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="736" y="162" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(740 166)"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g>
<text class="elw-eyebrow" x="872" y="182" text-anchor="end">04</text>
<text class="elw-text" x="736" y="214">人工复核</text>
<text class="elw-sub" x="736" y="234">对照代码，确认 AI 判断</text>
</g>
<g data-graph-role="node" data-node-id="export" data-bounds="944,148,168,108">
<rect class="elw-node" x="944" y="148" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="960" y="162" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(964 166)"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></g>
<text class="elw-eyebrow" x="1096" y="182" text-anchor="end">05</text>
<text class="elw-text" x="960" y="214">导出与归档</text>
<text class="elw-sub" x="960" y="234">导出报告 · 合并后归档</text>
</g>
<g data-graph-role="node" data-node-id="feedback" data-bounds="720,340,168,108">
<rect class="elw-node" x="720" y="340" width="168" height="108" rx="12"/>
<rect class="elw-badge" x="736" y="354" width="32" height="32" rx="8"/>
<g class="elw-icon" transform="translate(740 358)"><path d="M20 14V4H4v14h6m2-6h9m-4-4 4 4-4 4M5 8h10"/></g>
<text class="elw-eyebrow" x="872" y="374" text-anchor="end">↺</text>
<text class="elw-text" x="736" y="406">发回修改草稿</text>
<text class="elw-sub" x="736" y="426">你确认发送，再改再审</text>
</g>
<text class="elw-sub" x="916" y="186" text-anchor="middle">完成</text>
<text class="elw-sub" x="818" y="302">需要修改</text>
<text class="elw-sub" x="456" y="483" text-anchor="middle">确认发送后继续修改 · 改完再审</text>
<path class="elw-main" d="M48 532h24"/><text class="elw-sub" x="80" y="536">评审流程</text>
<path class="elw-feedback" d="M190 532h24"/><text class="elw-sub" x="222" y="536">需人工确认的反馈</text>
</svg>
